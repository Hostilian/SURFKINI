name: SURFKINI CI Build & Test Pipeline

on:
  push:
    branches: [ main, "feature/*", "agent/*" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Automated QA & Physics Assertion Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Test Suite
        run: |
          python SURFKINI/run_tests.py
